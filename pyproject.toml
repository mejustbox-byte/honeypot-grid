[project]
name = "honeypot-grid"
version = "0.1.0"
description = "Offline policy and mock lifecycle manager for isolated honeypot labs"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["uv==0.12.19", "pytest==9.1.1", "ruff==0.16.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
