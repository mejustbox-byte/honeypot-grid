name: Verified alpha release
on:
  push:
    branches: [main]
    paths: [pyproject.toml, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-alpha-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'mejustbox-byte/honeypot-grid' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
      - run: 'python -m pip install --only-binary=:all: uv==0.12.19'
      - run: uv sync --locked
      - run: uv run --locked ruff check . && uv run --locked ruff format --check .
      - run: uv run --locked pytest -q
      - run: uv run --locked python scripts/smoke.py
      - run: uv run --locked python scripts/cli_smoke.py
      - run: bash -n scripts/cloud_setup.sh scripts/cloud_check.sh lab/vm-init scripts/publish_alpha.sh
      - run: uv build
      - run: python scripts/release_manifest.py
      - name: Publish verified alpha artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish_alpha.sh
