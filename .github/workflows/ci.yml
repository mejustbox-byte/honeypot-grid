name: Offline MVP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
      - run: python -m pip install --only-binary=:all: uv==0.12.19
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q
      - run: uv run --locked python scripts/smoke.py
      - name: Offline CLI plan
        run: uv run --locked python -m honeypot_grid --database /tmp/honeypot-grid.sqlite3 plan --config examples/lab.json --scope examples/scope.json
